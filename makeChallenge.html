<!DOCTYPE html>
<html lang="en">

<head>
    <title>What's your challenge?</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        
        @import url(https://fonts.googleapis.com/css?family=Hind);

        html {
            font-family: hind;
            font-weight: bold;
            text-align: center;
        }
        #back-button {
            max-width: 60px;
            max-height: 60px;
            margin-right:100vw;
            margin-left:2vw;
            margin-top: 2vh;
        }
        #arrow-icon {
            max-width: 80px;
            max-height: 80px;
            padding-left:38%;
            padding-right:38%;

        }
        #input-field {
            display: grid;
            background-color: #d9d9d9;
            align-items: center;
   
        }
        #text-class1 {
            color: #484848;
            text-align: left;
            padding-left: 5vw;
        }
        #dates {
            align-items: center;
            margin-top: 50vh;
            margin-left:30%;

            max-width: 40%;
            background-color: #8f8f8f;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

         
        }





        #navbar {
            margin-top: 30%;
            background-color: #d9d9d9;
            min-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        #navbar #navbar-icon img {
            max-width: 20%;
            max-height: 20%;
        }
    </style>

    <!-- Web Components for shared navbar and footer layout -->
    <!-- <script type="module" src="/src/components/site-navbar.js"></script> -->
    <!-- <script type="module" src="/src/components/site-footer.js"></script> -->
</head>

<body>
    <div id="input-field">
        <img id="back-button" src="./public/images/back.png" alt="Back">

        <form id="challengeForm">
            <h1>What's your challenge?</h1>
            <input
                type="text"
                id="challengeTitle"
                placeholder="Enter your challenge"
                required
            >

            <h2>Description</h2>
            <textarea
                id="challengeDescription"
                placeholder="Describe your challenge..."
                required
            ></textarea>

            <div id="dates">
                <div>
                    <p>Start Date</p>
                    <input type="date" id="startDate" required>
                </div>

                <img id="arrow-icon" src="./public/images/arrow.png" alt="To">

                <div>
                    <p>End Date</p>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <button type="submit">Next</button>
        </form>
    </div>







    <div id="navbar">
        <div id="navbar-icon">
            <figure>
                <img src="./public/images/navbaricon1.png">
                <figcaption>
                    <h2>Challenge</h2>
                </figcaption>
            </figure>
        </div>
        <div id="navbar-icon">
            <figure>
                <img src="./public/images/navbaricon2.png">
                <figcaption>
                    <h2>Calendar</h2>
                </figcaption>
            </figure>
        </div>
        <div id="navbar-icon">
            <figure>
                <img src="./public/images/navbaricon3.png">
                <figcaption>
                    <h2>Profile</h2>
                </figcaption>
            </figure>
        </div>
    </div>

    <!-- our own navbar goes here -->
    <!-- <site-navbar></site-navbar> -->
    
    <!-- Main content goes here -->

    <!-- our own footer goes here -->
    <!-- <site-footer></site-footer> -->
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/challenge.js"></script>

</body>

</html>
