<!DOCTYPE html>
<html lang="en">

<head>
    <title>What's your challenge?</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./src/styles/style.css">


    <!-- Web Components for shared navbar and footer layout -->
    <!-- <script type="module" src="/src/components/site-navbar.js"></script> -->
    <!-- <script type="module" src="/src/components/site-footer.js"></script> -->
</head>

<body>
    <button onclick="history.back()">Go Back</button>

    <div id="input-field">
        <img id="back-button" src="./public/images/back.png" alt="Back">

        <form id="challengeForm">
            <h1>What's your challenge?</h1>
            <input type="text" id="challengeTitle" placeholder="Enter your challenge" required>

            <div id="subtask">
                <div id="s1">
                    <h2 id="text-class1">Subtask:</h2>
                    <input type="text" id="subtaskTitle" placeholder="Enter your subtask" required>

                </div>
                <div id="s2">
                    <h2 id="text-class1">Description:</h2>
                    <input type="text" id="subtaskDescription" placeholder="Describe your subtask" required>
                </div>
                <div id="s3">
                    <h2 id="text-class1">Due Date:</h2>
                    <input type="date" id="subtaskDate" required>
                </div>

            </div>
            <div>
                <img id="add-subtask" src="./public/images/addSubtask.png" alt="Add Subtask">
            </div>

            <div id="dates">
                <div>
                    <p>Start Date</p>
                    <input type="date" id="startDate" required>
                </div>

                <img id="arrow-icon" src="./public/images/arrow.png" alt="To">

                <div>
                    <p>End Date</p>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <button type="submit">Next</button>
        </form>
    </div>







    <div id="navbar">
        <div id="navbar-icon">
            <figure>
                <img src="./public/images/navbaricon1.png">
                <figcaption>
                    <h2>Challenge</h2>
                </figcaption>
            </figure>
        </div>
        <div id="navbar-icon">
            <figure>
                <img src="./public/images/navbaricon3.png">
                <figcaption>
                    <h2>Profile</h2>
                </figcaption>
            </figure>
        </div>
    </div>

    <!-- our own navbar goes here -->
    <!-- <site-navbar></site-navbar> -->

    <!-- Main content goes here -->

    <!-- our own footer goes here -->
    <!-- <site-footer></site-footer> -->

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/makeChallenge.js"></script>

</body>

</html>
